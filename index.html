<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Minha lista de compras</title>
    <meta name="theme-color" content="#1f6b4a" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f5f0;
        --surface: #ffffff;
        --ink: #1c2a22;
        --muted: #66756b;
        --line: #dde5dc;
        --accent: #1f6b4a;
        --accent-soft: #dcefe3;
        --done: #98a69c;
        --note: #8a5a00;
        --note-bg: #fbefd2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121a15;
          --surface: #1a251e;
          --ink: #e8efe9;
          --muted: #9aaba0;
          --line: #2a382f;
          --accent: #5fc58f;
          --accent-soft: #23372b;
          --done: #66756b;
          --note: #f0c77a;
          --note-bg: #3a2f17;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        scroll-padding-top: 130px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Figtree",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 17px;
        line-height: 1.4;
        -webkit-text-size-adjust: 100%;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }

      .topo {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .contagem {
        font-size: 0.95rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .contagem strong {
        color: var(--ink);
        font-size: 1.15rem;
      }
      .resumo-topo {
        display: grid;
        justify-items: end;
        gap: 2px;
      }
      .total-aproximado {
        color: var(--muted);
        font-size: 0.82rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .barra {
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        margin: 10px 0 12px;
        overflow: hidden;
      }
      .barra > span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.25s ease;
      }

      .acoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status-sync {
        align-self: center;
        margin: 0 0 0 auto;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .acoes button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      .acoes button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .acoes button[aria-pressed="true"] {
          color: #0e1a13;
        }
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }

      .ferramentas-csv {
        max-width: 640px;
        margin: 0 auto;
        padding: 0 16px calc(32px + env(safe-area-inset-bottom, 0px));
      }
      .ferramentas-csv h2 {
        margin: 0 0 8px;
        font-size: 1.05rem;
      }
      .ferramentas-csv p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .ferramentas-csv .acoes {
        align-items: center;
      }
      .resultado-csv {
        margin-top: 12px !important;
        white-space: pre-line;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      section {
        margin-bottom: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      section.completa {
        border-color: var(--accent);
      }
      summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 1.05rem;
        min-height: 52px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary .qtd {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      section.completa summary .qtd {
        color: var(--accent);
      }
      summary::after {
        content: "";
        width: 8px;
        height: 8px;
        flex: none;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 0.15s ease;
        margin-left: 4px;
      }
      details[open] > summary::after {
        transform: rotate(-135deg);
      }
      summary:focus-visible,
      .item:focus-within {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 0;
      }
      li.oculto {
        display: none;
      }

      .item {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 13px 16px;
        cursor: pointer;
        min-height: 56px;
      }
      .item input {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 28px;
        height: 28px;
        margin: 1px 0 0;
        border: 2px solid var(--muted);
        border-radius: 8px;
        background: transparent;
        display: grid;
        place-content: center;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .item input::after {
        content: "";
        width: 7px;
        height: 13px;
        margin-top: -2px;
        border-right: 3px solid #fff;
        border-bottom: 3px solid #fff;
        transform: rotate(45deg) scale(0);
        transition: transform 0.12s ease;
      }
      .item input:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .item input:checked::after {
        transform: rotate(45deg) scale(1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .item input::after {
          border-color: #0e1a13;
        }
      }
      .item input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .texto {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .nome {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .detalhe {
        font-size: 0.88rem;
        color: var(--muted);
      }
      .preco-aproximado {
        font-size: 0.88rem;
        color: var(--accent);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .valores-item {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-variant-numeric: tabular-nums;
      }
      .total-item {
        font-size: 0.88rem;
        color: var(--muted);
        font-weight: 600;
      }
      .obs {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--note);
        background: var(--note-bg);
        padding: 3px 9px;
        border-radius: 8px;
        align-self: flex-start;
      }

      .item:has(input:checked) .nome {
        text-decoration: line-through;
        color: var(--done);
        font-weight: 500;
      }
      .item:has(input:checked) .detalhe,
      .item:has(input:checked) .obs {
        opacity: 0.55;
      }

      .novo-wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 16px 0;
      }
      #form-novo {
        display: grid;
        grid-template-columns:
          minmax(0, 1.35fr) minmax(110px, 1fr) minmax(88px, 0.75fr)
          auto;
        gap: 8px;
        align-items: stretch;
      }
      #form-novo select {
        width: 100%;
        min-width: 0;
        font: inherit;
        padding: 12px 10px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-auth {
        display: grid;
        gap: 8px;
      }
      #form-auth label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      #form-auth input {
        min-width: 0;
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-auth input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-auth .acoes {
        margin-top: 4px;
      }
      #form-novo input {
        min-width: 0;
        font: inherit;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-novo #novo-nome {
        grid-column: 1 / -1;
      }
      #form-novo #novo-quantidade {
        grid-column: 2;
      }
      #form-novo #novo-unidade {
        grid-column: 3;
      }
      #form-novo #novo-categoria {
        grid-column: 1;
      }
      #form-novo button {
        grid-column: 4;
      }
      #form-novo input::placeholder {
        color: var(--muted);
      }
      #form-novo input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-novo select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-novo button {
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 12px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #form-novo button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        #form-novo {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        #form-novo #novo-nome {
          grid-column: 1 / -1;
        }
        #form-novo #novo-categoria {
          grid-column: 1;
        }
        #form-novo #novo-quantidade {
          grid-column: 2;
        }
        #form-novo #novo-unidade {
          grid-column: 1;
        }
        #form-novo button {
          grid-column: 2;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #form-novo button {
          color: #0e1a13;
        }
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      li.com-remover:not(.oculto) {
        display: flex;
        align-items: stretch;
      }
      li.com-remover .item {
        flex: 1;
        min-width: 0;
      }
      .remover {
        flex: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.6rem;
        line-height: 1;
        padding: 0 18px;
        cursor: pointer;
      }
      .remover:hover {
        color: var(--ink);
      }
      .remover:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }

      .aviso {
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .aviso h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .aviso p {
        margin: 6px 0;
        color: var(--muted);
      }
      .aviso code {
        background: var(--accent-soft);
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 0.9em;
      }

      #dialog-editar {
        width: min(440px, calc(100vw - 32px));
        max-width: 100%;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
      }
      #dialog-editar::backdrop {
        background: rgb(0 0 0 / 45%);
      }
      #form-editar {
        display: grid;
        gap: 8px;
        padding: 20px;
      }
      #form-editar h2 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      #form-editar label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      #form-editar input,
      #form-editar select {
        width: 100%;
        min-width: 0;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
      #form-editar input:focus-visible,
      #form-editar select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-editar .acoes {
        justify-content: flex-end;
        margin-top: 8px;
      }
      #form-editar button[type="submit"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .fim {
        text-align: center;
        padding: 18px;
        font-weight: 700;
        color: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="topo">
          <h1>Lista de compras</h1>
          <div class="resumo-topo">
            <div class="contagem" id="contagem" aria-live="polite"></div>
            <div
              class="total-aproximado"
              id="total-aproximado"
              aria-live="polite"
            >
              Total aproximado: R$ 0,00
            </div>
            <div
              class="total-aproximado"
              id="total-pegos"
              aria-live="polite"
              aria-label="Total aproximado dos itens pegos"
              title="Total aproximado dos itens pegos"
            >
              Total pegos: R$ 0,00
            </div>
          </div>
        </div>
        <div
          class="barra"
          role="progressbar"
          aria-label="Itens pegos"
          aria-valuemin="0"
          aria-valuemax="100"
          id="barra"
        >
          <span id="barra-preench"></span>
        </div>
        <div class="acoes">
          <button type="button" id="btn-ocultar" aria-pressed="false">
            Ocultar pegos
          </button>
          <button type="button" id="btn-limpar">Desmarcar tudo</button>
          <p id="status-supabase" class="status-sync" role="status"></p>
          <button type="button" id="btn-sair" hidden>Sair</button>
        </div>
      </div>
    </header>

    <div class="novo-wrap">
      <div id="painel-conta" class="aviso" aria-live="polite">
        <form id="form-auth" autocomplete="on">
          <label for="auth-email">E-mail</label>
          <input id="auth-email" type="email" autocomplete="email" required />
          <label for="auth-senha">Senha</label>
          <input
            id="auth-senha"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <div class="acoes">
            <button type="submit" id="btn-entrar">Entrar</button>
            <button type="button" id="btn-criar-conta">Criar conta</button>
          </div>
        </form>
      </div>
      <form id="form-novo" autocomplete="off">
        <label for="novo-nome" class="sr">Novo item</label>
        <input
          id="novo-nome"
          type="text"
          placeholder="Adicionar item à lista"
          maxlength="80"
          enterkeyhint="done"
        />
        <label for="novo-categoria" class="sr">Categoria do novo item</label>
        <select id="novo-categoria" required></select>
        <label for="novo-quantidade" class="sr">Quantidade</label>
        <input
          id="novo-quantidade"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
          placeholder="Qtd."
          enterkeyhint="done"
        />
        <label for="novo-unidade" class="sr">Unidade</label>
        <select id="novo-unidade">
          <option value="Un" selected>Un</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="mg">mg</option>
          <option value="L">L</option>
          <option value="mL">mL</option>
          <option value="pacote">pacote</option>
          <option value="caixa">caixa</option>
          <option value="bandeja">bandeja</option>
          <option value="frasco">frasco</option>
          <option value="lata">lata</option>
          <option value="pote">pote</option>
          <option value="sachê">sachê</option>
          <option value="rolo">rolo</option>
        </select>
        <button type="submit">Adicionar</button>
      </form>
    </div>

    <dialog id="dialog-editar" aria-labelledby="titulo-editar">
      <form id="form-editar" method="dialog">
        <h2 id="titulo-editar">Editar item</h2>
        <label for="editar-nome">Nome</label>
        <input id="editar-nome" type="text" maxlength="80" required />
        <label for="editar-categoria">Categoria</label>
        <select id="editar-categoria" required></select>
        <label for="editar-quantidade">Quantidade</label>
        <input
          id="editar-quantidade"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
        />
        <label for="editar-unidade">Unidade</label>
        <select id="editar-unidade"></select>
        <label for="editar-preco">Preço Aproximado (R$)</label>
        <input
          id="editar-preco"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0,00"
        />
        <label for="editar-observacao">Observação</label>
        <input id="editar-observacao" type="text" maxlength="160" />
        <div class="acoes">
          <button type="button" id="cancelar-edicao">Cancelar</button>
          <button type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <main id="app"><p class="detalhe">Carregando lista…</p></main>

    <footer
      class="ferramentas-csv"
      id="ferramentas-csv"
      aria-labelledby="titulo-csv"
      hidden
    >
      <h2 id="titulo-csv">Dados dos produtos</h2>
      <p>
        A importação adiciona somente produtos novos ao catálogo compartilhado.
        Eles ficarão visíveis para todos os usuários.
      </p>
      <div class="acoes">
        <button type="button" id="btn-exportar-csv">Exportar CSV</button>
        <button type="button" id="btn-modelo-csv">Baixar modelo</button>
        <button type="button" id="btn-importar-csv">Importar CSV</button>
        <input
          class="sr"
          id="arquivo-csv"
          type="file"
          accept=".csv,text/csv"
          aria-label="Selecionar arquivo CSV para importar"
        />
      </div>
      <p
        class="resultado-csv"
        id="resultado-csv"
        role="status"
        aria-live="polite"
        hidden
      ></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>

        const totalPegos = document.getElementById("total-pegos");
        const painelConta = document.getElementById("painel-conta");

        const arquivoCsv = document.getElementById("arquivo-csv");
        const resultadoCsv = document.getElementById("resultado-csv");
        let usuario = null;
        let carregandoRemoto = false;
        let temporizadorSync = null;
        let catalogoAtual = [];

        const CABECALHOS_CSV = [
          "categoria",
          "nome",
          "quantidade",

        function definirStatus(mensagem) {
          statusSupabase.textContent = mensagem;
        }

        function agendarSincronizacao() {
          if (!supabaseClient || !usuario || carregandoRemoto) return;
          clearTimeout(temporizadorSync);
          temporizadorSync = setTimeout(async () => {
            definirStatus("Sincronizando…");
            const { error } = await supabaseClient
              .from("lista_compras_estado")
              .upsert(
                {
                  user_id: usuario.id,
                  marcados: [...marcados],
                  extras,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id" },
              );
            if (error) {
              definirStatus("Falha ao sincronizar. Verifique a conexão.");
              console.error("Falha ao sincronizar a lista:", error);
            } else {
              definirStatus("Sincronizado");
            }
          }, 300);
        }

        function mostrarAreaAutenticada(autenticado) {
          app.hidden = Boolean(supabaseClient && !autenticado);

        async function carregarEstadoRemoto(sessao) {
          usuario = sessao?.user ?? null;
          mostrarAreaAutenticada(Boolean(usuario));
          if (!usuario) {
            definirStatus(
              "Entre para sincronizar sua lista entre dispositivos.",

            return;
          }

          carregandoRemoto = true;
          definirStatus("Carregando lista…");
          const { data: catalogo, error: erroCatalogo } = await supabaseClient
            .from("lista_compras_catalogo")
            .select("produtos")
            .eq("id", true)
            .single();

          if (erroCatalogo || !Array.isArray(catalogo?.produtos)) {
            carregandoRemoto = false;
            mostrarErro(
              erroCatalogo
                ? `Falha ao carregar o catálogo do Supabase: ${erroCatalogo.message}`
                : "O catálogo do Supabase está vazio ou em formato inválido.",
            );
            return;
          }

          montar(catalogo.produtos);

          const { data, error } = await supabaseClient
            .from("lista_compras_estado")
            .select("marcados, extras")
            .eq("user_id", usuario.id)
            .maybeSingle();

          if (error) {
            carregandoRemoto = false;
            console.error("Falha ao carregar estado da lista:", error);
            return;
          }

          if (data) {
            marcados.clear();
            (Array.isArray(data.marcados) ? data.marcados : []).forEach((id) =>
              marcados.add(id),

            extras = Array.isArray(data.extras)
              ? data.extras
                  .filter(
                    (item) =>
                      item &&
                      typeof item.id === "string" &&
                      typeof item.nome === "string",
                  )
                  .map((item) => {
                    const quantidade = separarQuantidade(
                      item.quantidade,
                      item.unidade,
                    );
                    return {
                      ...item,
                      categoria: categorias.includes(item.categoria)

                        : categoriaPadrao(),
                      ...quantidade,
                    };
                  })
              : [];
          }
          montar(catalogo.produtos);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          guardar.gravar(CHAVE_EXTRAS, extras);
          carregandoRemoto = false;
          if (data) {
            definirStatus("Sincronizado");
          } else {
            definirStatus("Sincronizando…");
            agendarSincronizacao();
          }
        }

        if (supabaseClient) {
          mostrarAreaAutenticada(false);
          supabaseClient.auth.onAuthStateChange((_evento, sessao) => {
            setTimeout(() => carregarEstadoRemoto(sessao), 0);
          });
        } else {
          formAuth.hidden = true;
          btnSair.hidden = true;
          definirStatus(
            "Configure a URL e a chave publicável do Supabase para carregar a lista.",

            "A lista agora é carregada do Supabase. Configure a conexão para continuar.",

        }

        formAuth.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!supabaseClient) return;
          definirStatus("Entrando…");
          const { error } = await supabaseClient.auth.signInWithPassword({

        btnCriarConta.addEventListener("click", async () => {
          if (!supabaseClient) return;
          definirStatus("Criando conta…");
          const { data, error } = await supabaseClient.auth.signUp({
            email: campoEmail.value.trim(),

          definirStatus(

        btnSair.addEventListener("click", async () => {

        function escaparCampoCsv(valor) {
          const texto = valor == null ? "" : String(valor);
          return /[;\"\r\n]/.test(texto)
            ? `"${texto.replaceAll('"', '""')}"`
            : texto;
        }

        function baixarCsv(nome, linhas) {
          const conteudo =
            "\uFEFF" +
            linhas
              .map((linha) => linha.map(escaparCampoCsv).join(";"))
              .join("\r\n");
          const url = URL.createObjectURL(
            new Blob([conteudo], { type: "text/csv;charset=utf-8" }),
          );
          const link = el("a", { href: url, download: nome });
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        function linhasDoCatalogo() {
          const linhas = [CABECALHOS_CSV];
          catalogoAtual.forEach((categoria) => {
            (categoria.itens || []).forEach((produto) => {
              const item =
                typeof produto === "string" ? { nome: produto } : produto;
              if (!item || typeof item.nome !== "string") return;
              const quantidade = separarQuantidade(
                item.quantidade,
                item.unidade,
              );
              linhas.push([
                categoria.categoria,
                item.nome,
                quantidade.quantidade ?? "",
                quantidade.unidade ?? "",
                normalizarPreco(item.preco_aproximado) ?? "",
                item.observacao ?? "",
              ]);
            });
          });
          return linhas;
        }

        function detectarDelimitadorCsv(texto) {
          let aspas = false;
          let pontoEVirgula = 0;
          let virgula = 0;
          for (let indice = 0; indice < texto.length; indice += 1) {
            const caractere = texto[indice];
            if (caractere === '"') {
              if (aspas && texto[indice + 1] === '"') indice += 1;
              else aspas = !aspas;
            } else if (!aspas && (caractere === "\n" || caractere === "\r")) {
              break;
            } else if (!aspas && caractere === ";") {
              pontoEVirgula += 1;
            } else if (!aspas && caractere === ",") {
              virgula += 1;
            }
          }
          return virgula > pontoEVirgula ? "," : ";";
        }

        function analisarCsv(texto, delimitador) {
          const registros = [];
          let campos = [];
          let campo = "";
          let entreAspas = false;
          let inicioLinha = 1;
          let linha = 1;
          for (let indice = 0; indice < texto.length; indice += 1) {
            const caractere = texto[indice];
            if (entreAspas) {
              if (caractere === '"' && texto[indice + 1] === '"') {
                campo += '"';
                indice += 1;
              } else if (caractere === '"') {
                entreAspas = false;
              } else {
                campo += caractere;
                if (caractere === "\n") linha += 1;
                else if (caractere === "\r" && texto[indice + 1] !== "\n")
                  linha += 1;
              }
              continue;
            }
            if (caractere === '"') {
              if (campo.length)
                throw new Error(`Aspas inesperadas na linha ${linha}.`);
              entreAspas = true;
            } else if (caractere === delimitador) {
              campos.push(campo);
              campo = "";
            } else if (caractere === "\n" || caractere === "\r") {
              campos.push(campo);
              registros.push({ linha: inicioLinha, campos });
              campos = [];
              campo = "";
              if (caractere === "\r" && texto[indice + 1] === "\n") indice += 1;
              linha += 1;
              inicioLinha = linha;
            } else {
              campo += caractere;
            }
          }
          if (entreAspas)
            throw new Error(
              `Campo entre aspas não foi fechado (linha ${inicioLinha}).`,
            );
          if (campo.length || campos.length) {
            campos.push(campo);
            registros.push({ linha: inicioLinha, campos });
          }
          return registros;
        }

        function normalizarTextoCsv(valor) {
          return String(valor ?? "")
            .trim()
            .replace(/\s+/g, " ");
        }

        function numeroCsv(valor) {
          const texto = normalizarTextoCsv(valor);
          if (!texto) return { valor: null };
          let normalizado = texto.replace(/\s/g, "");
          if (normalizado.includes(",") && normalizado.includes(".")) {
            if (normalizado.lastIndexOf(",") > normalizado.lastIndexOf(".")) {
              normalizado = normalizado.replace(/\./g, "").replace(",", ".");
            } else {
              normalizado = normalizado.replace(/,/g, "");
            }
          } else if (normalizado.includes(",")) {
            normalizado = normalizado.replace(",", ".");
          }
          const numero = Number(normalizado);
          return Number.isFinite(numero) && numero >= 0
            ? { valor: numero }
            : { erro: "valor numérico inválido ou negativo" };
        }

        function validarArquivoCsv(texto) {
          const registros = analisarCsv(texto, detectarDelimitadorCsv(texto));
          const cabecalho = registros.shift();
          if (!cabecalho) throw new Error("O arquivo não contém cabeçalho.");
          const colunas = cabecalho.campos.map((campo, indice) =>
            normalizarTextoCsv(campo)
              .replace(indice === 0 ? /^\uFEFF/ : /$^/, "")
              .toLowerCase(),
          );
          const mapa = new Map(
            colunas.map((coluna, indice) => [coluna, indice]),
          );
          if (!mapa.has("categoria") || !mapa.has("nome")) {
            throw new Error("O CSV precisa das colunas categoria e nome.");
          }
          if (mapa.size !== colunas.length)
            throw new Error("O cabeçalho contém colunas repetidas.");
          if (colunas.some((coluna) => !CABECALHOS_CSV.includes(coluna))) {
            throw new Error("O cabeçalho contém uma coluna desconhecida.");
          }
          if (
            registros.filter((registro) =>
              registro.campos.some((campo) => normalizarTextoCsv(campo)),
            ).length > 5000
          ) {
            throw new Error(
              "O limite é de 5000 linhas de produtos por arquivo.",
            );
          }

          const validos = [];
          const erros = [];
          registros.forEach((registro) => {
            if (registro.campos.every((campo) => !normalizarTextoCsv(campo)))
              return;
            const obter = (nome) =>
              mapa.has(nome) ? (registro.campos[mapa.get(nome)] ?? "") : "";
            const categoria = normalizarTextoCsv(obter("categoria"));
            const nome = normalizarTextoCsv(obter("nome"));
            const quantidade = numeroCsv(obter("quantidade"));
            const preco = numeroCsv(obter("preco_aproximado"));
            const unidade = normalizarTextoCsv(obter("unidade"));
            const observacao = normalizarTextoCsv(obter("observacao"));
            const problemas = [];
            if (!categoria) problemas.push("categoria obrigatória");
            if (!nome) problemas.push("nome obrigatório");
            if (nome.length > 80)
              problemas.push("nome deve ter até 80 caracteres");
            if (observacao.length > 160)
              problemas.push("observação deve ter até 160 caracteres");
            if (quantidade.erro)
              problemas.push(`quantidade ${quantidade.erro}`);
            if (preco.erro) problemas.push(`preço ${preco.erro}`);
            if (
              registro.campos.length > colunas.length &&
              registro.campos
                .slice(colunas.length)
                .some((campo) => normalizarTextoCsv(campo))
            ) {
              problemas.push("há mais valores que colunas no cabeçalho");
            }
            if (problemas.length) {
              erros.push({
                linha: registro.linha,
                mensagem: problemas.join(", "),
              });
              return;
            }
            validos.push({
              linha: registro.linha,
              categoria,
              nome,
              quantidade: quantidade.valor,
              unidade: unidade || null,
              preco_aproximado: preco.valor,
              observacao: observacao || null,
            });
          });
          return { validos, erros };
        }

        function mostrarResultadoImportacao(importados, existentes, erros) {
          const detalhes = erros
            .slice(0, 20)
            .map((erro) => `Linha ${erro.linha}: ${erro.mensagem}`);
          const restante = erros.length - detalhes.length;
          resultadoCsv.textContent = [
            `Importados: ${importados} | Já existentes: ${existentes} | Erros: ${erros.length}`,
            ...detalhes,
            ...(restante > 0 ? [`E mais ${restante} erro(s).`] : []),
          ].join("\n");
          resultadoCsv.hidden = false;
        }

        btnExportarCsv.addEventListener("click", () => {
          if (!catalogoAtual.length) {
            resultadoCsv.textContent = "O catálogo ainda não foi carregado.";
            resultadoCsv.hidden = false;
            return;
          }
          baixarCsv("produtos-catalogo.csv", linhasDoCatalogo());
          resultadoCsv.textContent = "Exportação do catálogo concluída.";
          resultadoCsv.hidden = false;
        });

        btnModeloCsv.addEventListener("click", () => {
          baixarCsv("modelo-produtos.csv", [CABECALHOS_CSV]);
        });

        btnImportarCsv.addEventListener("click", () => {
          if (!usuario || !supabaseClient) {
            resultadoCsv.textContent =
              "Entre na sua conta para importar produtos.";
            resultadoCsv.hidden = false;
            return;
          }
          arquivoCsv.click();
        });

        arquivoCsv.addEventListener("change", async () => {
          const arquivo = arquivoCsv.files?.[0];
          if (!arquivo) return;
          const botoesCsv = [btnExportarCsv, btnModeloCsv, btnImportarCsv];
          let linhasCsv = [];
          let errosCsv = [];
          try {
            const { validos, erros } = validarArquivoCsv(await arquivo.text());
            linhasCsv = validos.map((item) => item.linha);
            errosCsv = erros;
            if (!validos.length) {
              mostrarResultadoImportacao(
                0,
                0,
                erros.length
                  ? erros
                  : [
                      {
                        linha: 1,
                        mensagem: "nenhum produto válido para importar",
                      },
                    ],
              );
              return;
            }
            if (
              !confirm(
                `Importar ${validos.length} linha(s) válida(s)? Produtos novos serão adicionados ao catálogo compartilhado e ficarão visíveis para todos. Itens existentes não serão alterados.`,
              )
            )
              return;

            botoesCsv.forEach((botao) => (botao.disabled = true));
            definirStatus("Importando produtos…");
            const { data, error } = await supabaseClient.rpc(
              "importar_itens_catalogo",
              {
                p_itens: validos,
              },
            );
            if (error || !data || !Array.isArray(data.resultados)) {
              const falha = error?.message || "resposta inválida da importação";
              mostrarResultadoImportacao(0, 0, [
                ...erros,
                ...validos.map((item) => ({
                  linha: item.linha,
                  mensagem: falha,
                })),
              ]);
              definirStatus("Falha ao importar produtos.");
              return;
            }

            const resultadoRemoto = data.resultados;
            const importados = resultadoRemoto.filter(
              (item) => item.status === "importado",
            ).length;
            const existentes = resultadoRemoto.filter(
              (item) => item.status === "existente",
            ).length;
            const errosRemotos = resultadoRemoto
              .filter((item) => item.status === "erro")
              .map((item) => ({
                linha: item.linha,
                mensagem: item.mensagem || "registro rejeitado",
              }));
            const { data: catalogo, error: erroCatalogo } = await supabaseClient
              .from("lista_compras_catalogo")
              .select("produtos")
              .eq("id", true)
              .single();
            if (!erroCatalogo && Array.isArray(catalogo?.produtos))
              montar(catalogo.produtos);
            mostrarResultadoImportacao(importados, existentes, [
              ...erros,
              ...errosRemotos,
            ]);
            definirStatus(
              erroCatalogo
                ? "Importado, mas não foi possível atualizar a lista."
                : "Importação concluída.",
            );
          } catch (erro) {
            const mensagem =
              erro instanceof Error
                ? erro.message
                : "Não foi possível ler o CSV.";
            mostrarResultadoImportacao(0, 0, [
              ...errosCsv,
              ...(linhasCsv.length
                ? linhasCsv.map((linha) => ({ linha, mensagem }))
                : [{ linha: 1, mensagem }]),
            ]);
            definirStatus("Falha ao ler o arquivo CSV.");
          } finally {
            botoesCsv.forEach((botao) => (botao.disabled = false));
            arquivoCsv.value = "";
          }
        });

        // ---- localStorage (com proteção para navegadores que bloqueiam) ----
        const guardar = {
          ler(chave, padrao) {
            try {
              const v = localStorage.getItem(chave);
              return v === null ? padrao : JSON.parse(v);
            } catch (e) {
              return padrao;
            }
          },
          gravar(chave, valor) {
            try {
              localStorage.setItem(chave, JSON.stringify(valor));
            } catch (e) {
              /* sem armazenamento */
            }
          },
        };

        const marcados = new Set(guardar.ler(CHAVE_MARCADOS, []));
        let ocultarPegos = guardar.ler(CHAVE_OCULTAR, false) === true;

        const salvarMarcados = () => {
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          agendarSincronizacao();
        };

        // ---- utilidades ----
        const idDoItem = (categoria, nome) => `${categoria}|${nome}`;
        const el = (tag, attrs = {}, ...filhos) => {
          const n = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (k === "class") n.className = v;
            else if (k === "text") n.textContent = v;
            else n.setAttribute(k, v);
          }
          filhos.forEach((f) => n.append(f));
          return n;
        };
        function separarQuantidade(quantidade, unidade) {
          const unidadeSalva =
            typeof unidade === "string" ? unidade.trim() : "";
          if (typeof quantidade === "number" && Number.isFinite(quantidade)) {
            return { quantidade, unidade: unidadeSalva };
          }

          const texto = typeof quantidade === "string" ? quantidade.trim() : "";
          if (!texto || /^n[aã]o informad/i.test(texto)) {
            return { quantidade: null, unidade: unidadeSalva };
          }

          const partes = texto.match(/^([0-9]+(?:[.,][0-9]+)?)(?:\s+(.+))?$/);
          if (partes) {
            return {
              quantidade: Number(partes[1].replace(",", ".")),
              unidade: unidadeSalva || partes[2]?.trim() || "",
            };
          }

          return { quantidade: null, unidade: unidadeSalva || texto };
        }

        function formatarQuantidade(quantidade, unidade) {
          const valor = separarQuantidade(quantidade, unidade);
          if (valor.quantidade === null) return valor.unidade;

          const quantidadeTexto = new Intl.NumberFormat("pt-BR", {
            maximumFractionDigits: 6,
          }).format(valor.quantidade);
          const unidadeTexto =
            valor.quantidade === 1
              ? valor.unidade
              : UNIDADES_PLURAIS[valor.unidade] || valor.unidade;
          return [quantidadeTexto, unidadeTexto].filter(Boolean).join(" ");
        }

        const normalizarPreco = (valor) => {
          if (valor === null || valor === undefined || valor === "")
            return null;
          const preco = Number(valor);
          return Number.isFinite(preco) && preco >= 0
            ? Math.round(preco * 100) / 100
            : null;
        };
        const formatarPreco = (valor) =>
          new Intl.NumberFormat("pt-BR", {
            style: "currency",
            currency: "BRL",
          }).format(valor);

        // ---- renderização ----
        const CHAVE_EXTRAS = "lista-compras:extras";
        const CATEGORIA_PADRAO = "Outros";
        const UNIDADE_PADRAO = "Un";
        const UNIDADES_PLURAIS = {
          pacote: "pacotes",
          caixa: "caixas",
          bandeja: "bandejas",
          frasco: "frascos",
          lata: "latas",
          pote: "potes",
          sachê: "sachês",
          rolo: "rolos",
        };
        let categorias = [];

        const categoriaPadrao = () =>
          categorias.includes(CATEGORIA_PADRAO)
            ? CATEGORIA_PADRAO
            : categorias.includes("Outros alimentos")
              ? "Outros alimentos"
              : categorias[0] || CATEGORIA_PADRAO;

        const lerExtras = () => {
          const v = guardar.ler(CHAVE_EXTRAS, []);
          return Array.isArray(v)
            ? v.filter(
                (x) =>
                  x && typeof x.id === "string" && typeof x.nome === "string",
              )
            : [];
        };
        let extras = lerExtras();
        const salvarExtras = () => {
          guardar.gravar(CHAVE_EXTRAS, extras);
          agendarSincronizacao();
        };

        let secoes = []; // { elemento, ids, qtd, lista }
        let total = 0;
        const precos = new Map();

        function criarItem(
          id,
          nome,
          quantidade,
          observacao,
          aoEditar,
          aoRemover,
          extra = false,
          precoAproximado = null,
          quantidadeNumerica = null,
        ) {
          const cb = el("input", { type: "checkbox" });
          cb.checked = marcados.has(id);
          cb.addEventListener("change", () => {
            if (cb.checked) marcados.add(id);
            else marcados.delete(id);
            salvarMarcados();
            atualizar();
          });

          const texto = el(
            "span",
            { class: "texto" },
            el("span", { class: "nome", text: nome }),
          );
          if (quantidade)
            texto.append(el("span", { class: "detalhe", text: quantidade }));
          const preco = normalizarPreco(precoAproximado);
          if (preco !== null) {
            const totalDoItem =
              preco * (quantidadeNumerica === null ? 1 : quantidadeNumerica);
            texto.append(
              el(
                "span",
                { class: "valores-item" },
                el("span", {
                  class: "preco-aproximado",
                  text: `Preço aprox.: ${formatarPreco(preco)}`,
                }),
                el("span", {
                  class: "total-item",
                  text: `Total: ${formatarPreco(totalDoItem)}`,
                }),
              ),
            );
          }
          if (observacao)
            texto.append(el("span", { class: "obs", text: observacao }));

          const li = el(
            "li",
            { "data-id": id },
            el("label", { class: "item" }, cb, texto),
          );
          if (extra) li.dataset.extra = "true";
          if (aoEditar) {
            const btn = el("button", {
              type: "button",
              class: "remover editar",
              "aria-label": `Editar ${nome}`,
              title: `Editar ${nome}`,
              text: "✎",
            });
            btn.addEventListener("click", aoEditar);
            li.classList.add("com-remover");
            li.append(btn);
          }
          if (aoRemover) {
            const btn = el("button", {
              type: "button",
              class: "remover",
              "aria-label": `Remover ${nome}`,
              text: "×",
            });
            btn.addEventListener("click", aoRemover);
            li.classList.add("com-remover");
            li.append(btn);
          }
          return li;
        }

        function criarSecao(titulo, ids, lista) {
          const qtd = el("span", { class: "qtd" });
          const detalhes = el(
            "details",
            { open: "" },
            el("summary", {}, el("span", { text: titulo }), qtd),
            lista,
          );
          return {
            elemento: el("section", {}, detalhes),
            titulo,
            detalhes,
            ids,
            idsBase: [...ids],
            qtd,
            lista,
          };
        }

        function montar(dados) {
          catalogoAtual = Array.isArray(dados) ? dados : [];
          app.replaceChildren();
          secoes = [];
          precos.clear();
          categorias = dados
            .map((cat) => cat.categoria)
            .filter(
              (categoria, indice, lista) =>
                typeof categoria === "string" &&
                lista.indexOf(categoria) === indice,
            );
          campoCategoriaNovo.replaceChildren(
            ...categorias.map((categoria) =>
              el("option", {
                value: categoria,
                text: categoria === "Outros alimentos" ? "Outros" : categoria,
              }),
            ),
          );
          campoCategoriaNovo.value = categoriaPadrao();
          extras = extras.map((item) => {
            const quantidade = separarQuantidade(item.quantidade, item.unidade);
            return {
              ...item,
              categoria: categorias.includes(item.categoria)
                ? item.categoria
                : categoriaPadrao(),
              ...quantidade,
              preco_aproximado: normalizarPreco(item.preco_aproximado),
            };
          });

          dados.forEach((cat) => {
            const ids = [];
            const lista = el("ul");
            (cat.itens || []).forEach((item) => {
              const obj = typeof item === "string" ? { nome: item } : item;
              if (!obj || !obj.nome) return;
              const id = idDoItem(cat.categoria, obj.nome);
              ids.push(id);
              const quantidade = separarQuantidade(obj.quantidade, obj.unidade);
              const preco = normalizarPreco(obj.preco_aproximado);
              if (preco !== null)
                precos.set(id, { preco, quantidade: quantidade.quantidade });
              lista.append(
                criarItem(
                  id,
                  obj.nome,
                  formatarQuantidade(quantidade.quantidade, quantidade.unidade),
                  obj.observacao || "",
                  () =>
                    abrirEditor({
                      tipo: "catalogo",
                      id,
                      categoria: cat.categoria,
                      nome: obj.nome,
                      quantidade: quantidade.quantidade,
                      unidade: quantidade.unidade,
                      precoAproximado: preco,
                      observacao: obj.observacao || "",
                    }),
                  () => removerItemCatalogo(cat.categoria, obj.nome, id),
                  false,
                  preco,
                  quantidade.quantidade,
                ),
              );
            });
            const sec = criarSecao(cat.categoria, ids, lista);
            secoes.push(sec);
            app.append(sec.elemento);
          });

          app.append(
            el("p", {
              class: "fim",
              id: "fim",
              hidden: "",
              text: "Compras concluídas! 🎉",
            }),
          );
          montarExtras();
          atualizar();
        }

        function montarExtras() {
          secoes.forEach((secao) => {
            secao.lista
              .querySelectorAll('li[data-extra="true"]')
              .forEach((item) => {
                precos.delete(item.dataset.id);
                item.remove();
              });
            secao.ids = [...secao.idsBase];

            extras
              .filter((item) => item.categoria === secao.titulo)
              .forEach((item) => {
                secao.ids.push(item.id);
                const quantidade = separarQuantidade(
                  item.quantidade,
                  item.unidade,
                );
                const preco = normalizarPreco(item.preco_aproximado);
                if (preco !== null)
                  precos.set(item.id, {
                    preco,
                    quantidade: quantidade.quantidade,
                  });
                secao.lista.append(
                  criarItem(
                    item.id,
                    item.nome,
                    formatarQuantidade(
                      quantidade.quantidade,
                      quantidade.unidade,
                    ),
                    item.observacao || "",
                    () =>
                      abrirEditor({
                        tipo: "extra",
                        id: item.id,
                        categoria: item.categoria,
                        nome: item.nome,
                        quantidade: quantidade.quantidade,
                        unidade: quantidade.unidade,
                        precoAproximado: preco,
                        observacao: item.observacao || "",
                      }),
                    () => removerExtra(item.id),
                    true,
                    preco,
                    quantidade.quantidade,
                  ),
                );
              });
          });
        }

        async function adicionarProdutoCompartilhado(
          nome,
          categoria,
          quantidade,
          unidade,
        ) {
          const limpo = nome.trim().replace(/\s+/g, " ");
          if (!limpo) return false;
          const quantidadeTexto = quantidade.trim();
          const quantidadeNumerica =
            quantidadeTexto === "" ? null : Number(quantidadeTexto);
          if (
            quantidadeNumerica !== null &&
            (!Number.isFinite(quantidadeNumerica) || quantidadeNumerica < 0)
          ) {
            definirStatus(
              "Informe uma quantidade válida maior ou igual a zero.",
            );
            return false;
          }
          if (!supabaseClient || !usuario) {
            definirStatus(
              "Entre na sua conta para adicionar produtos compartilhados.",
            );
            return false;
          }
          const categoriaEscolhida = categorias.includes(categoria)
            ? categoria
            : categoriaPadrao();
          definirStatus("Adicionando produto ao catálogo compartilhado…");
          const { data, error } = await supabaseClient.rpc(
            "importar_itens_catalogo",
            {
              p_itens: [
                {
                  linha: 1,
                  categoria: categoriaEscolhida,
                  nome: limpo,
                  quantidade: quantidadeNumerica,
                  unidade:
                    quantidadeNumerica === null
                      ? null
                      : unidade.trim() || UNIDADE_PADRAO,
                },
              ],
            },
          );
          if (error || !data?.resultados?.[0]) {
            definirStatus(
              error
                ? `Falha ao adicionar o produto: ${error.message}`
                : "A resposta do Supabase foi inválida.",
            );
            return false;
          }

          const resultado = data.resultados[0];
          if (resultado.status === "existente") {
            definirStatus(
              "Esse produto já existe nessa categoria no catálogo compartilhado.",
            );
            return true;
          }
          if (resultado.status !== "importado") {
            definirStatus(
              `Não foi possível adicionar o produto: ${resultado.mensagem || "dados inválidos"}.`,
            );
            return false;
          }

          const { data: catalogo, error: erroCatalogo } = await supabaseClient
            .from("lista_compras_catalogo")
            .select("produtos")
            .eq("id", true)
            .single();
          if (erroCatalogo || !Array.isArray(catalogo?.produtos)) {
            definirStatus(
              "Produto compartilhado salvo. Atualize a página para carregá-lo.",
            );
            return true;
          }
          montar(catalogo.produtos);
          const secao = secoes.find(
            (item) => item.titulo === categoriaEscolhida,
          );
          if (secao) secao.detalhes.open = true;
          definirStatus(
            "Produto adicionado. Todos os usuários já podem vê-lo.",
          );
          return true;
        }

        function removerExtra(id) {
          const extra = extras.find((item) => item.id === id);
          if (!extra || !confirm(`Excluir "${extra.nome}" da sua lista?`)) {
            return;
          }
          extras = extras.filter((x) => x.id !== id);
          marcados.delete(id);
          salvarExtras();
          salvarMarcados();
          montarExtras();
          atualizar();
        }

        async function removerItemCatalogo(categoria, nome, id) {
          if (
            !confirm(
              `Excluir "${nome}" do catálogo compartilhado para todos os usuários?`,
            )
          ) {
            return;
          }

          definirStatus("Sincronizando…");
          const { data, error } = await supabaseClient.rpc(
            "remover_item_catalogo",
            { p_categoria: categoria, p_nome: nome },
          );

          if (error || !data) {
            definirStatus(
              error
                ? "Falha ao excluir o item compartilhado."
                : "O item já não está no catálogo. Atualize a página.",
            );
            if (error) console.error("Falha ao excluir item:", error);
            return;
          }

          marcados.delete(id);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          const secao = secoes.find((item) => item.ids.includes(id));
          if (secao) {
            secao.ids = secao.ids.filter((itemId) => itemId !== id);
            secao.idsBase = secao.idsBase.filter((itemId) => itemId !== id);
            const linha = [...secao.lista.querySelectorAll("li[data-id]")].find(
              (item) => item.dataset.id === id,
            );
            if (linha) linha.remove();
            atualizar();
          }
          definirStatus("Sincronizado");
        }

        function atualizar() {
          let pegos = 0;
          total = secoes.reduce((n, s) => n + s.ids.length, 0);
          const somaPrecos = secoes.reduce(
            (soma, secao) =>
              soma +
              secao.ids.reduce((subtotal, id) => {
                const item = precos.get(id);
                if (!item) return subtotal;
                return (
                  subtotal +
                  item.preco * (item.quantidade === null ? 1 : item.quantidade)
                );
              }, 0),
            0,
          );
          const somaPegos = secoes.reduce(
            (soma, secao) =>
              soma +
              secao.ids.reduce((subtotal, id) => {
                if (!marcados.has(id)) return subtotal;
                const item = precos.get(id);
                if (!item) return subtotal;
                return (
                  subtotal +
                  item.preco * (item.quantidade === null ? 1 : item.quantidade)
                );
              }, 0),
            0,
          );
          totalAproximado.textContent = `Total aproximado: ${formatarPreco(somaPrecos)}`;
          totalPegos.textContent = `Total pegos: ${formatarPreco(somaPegos)}`;
          secoes.forEach((s) => {
            const feitos = s.ids.filter((id) => marcados.has(id)).length;
            pegos += feitos;
            s.qtd.textContent = `${feitos}/${s.ids.length}`;
            s.elemento.classList.toggle(
              "completa",
              s.ids.length > 0 && feitos === s.ids.length,
            );
            s.lista.querySelectorAll("li").forEach((li) => {
              li.classList.toggle(
                "oculto",
                ocultarPegos && marcados.has(li.dataset.id),
              );
            });
            s.elemento.hidden =
              ocultarPegos && feitos === s.ids.length && s.ids.length > 0;
          });

          const pct = total ? Math.round((pegos / total) * 100) : 0;
          contagem.innerHTML = `<strong>${pegos}</strong> de ${total} pegos`;
          barraPreench.style.width = pct + "%";
          barra.setAttribute("aria-valuenow", pct);
          const fim = document.getElementById("fim");
          if (fim) fim.hidden = !(total > 0 && pegos === total);
        }

        // ---- formulário de novo item ----
        const formNovo = document.getElementById("form-novo");
        const campoNovo = document.getElementById("novo-nome");
        const campoQuantidadeNovo = document.getElementById("novo-quantidade");
        const campoCategoriaNovo = document.getElementById("novo-categoria");
        const campoUnidadeNovo = document.getElementById("novo-unidade");
        const dialogEditar = document.getElementById("dialog-editar");
        const formEditar = document.getElementById("form-editar");
        const campoEditarNome = document.getElementById("editar-nome");
        const campoEditarCategoria =
          document.getElementById("editar-categoria");
        const campoEditarQuantidade =
          document.getElementById("editar-quantidade");
        const campoEditarUnidade = document.getElementById("editar-unidade");
        const campoEditarPreco = document.getElementById("editar-preco");
        const campoEditarObservacao =
          document.getElementById("editar-observacao");
        let itemEmEdicao = null;

        function abrirEditor(item) {
          itemEmEdicao = item;
          campoEditarCategoria.replaceChildren(
            ...categorias.map((categoria) =>
              el("option", {
                value: categoria,
                text: categoria === "Outros alimentos" ? "Outros" : categoria,
              }),
            ),
          );
          campoEditarUnidade.replaceChildren(
            ...[...campoUnidadeNovo.options].map((option) =>
              el("option", { value: option.value, text: option.textContent }),
            ),
          );
          if (
            item.unidade &&
            ![...campoEditarUnidade.options].some(
              (option) => option.value === item.unidade,
            )
          ) {
            campoEditarUnidade.append(
              el("option", { value: item.unidade, text: item.unidade }),
            );
          }
          campoEditarNome.value = item.nome;
          campoEditarCategoria.value = item.categoria;
          campoEditarQuantidade.value = item.quantidade ?? "";
          campoEditarUnidade.value = item.unidade || UNIDADE_PADRAO;
          campoEditarPreco.value = item.precoAproximado ?? "";
          campoEditarObservacao.value = item.observacao;
          dialogEditar.showModal();
          campoEditarNome.focus();
        }

        document
          .getElementById("cancelar-edicao")
          .addEventListener("click", () => dialogEditar.close());

        formEditar.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!itemEmEdicao) return;

          const atual = itemEmEdicao;
          const nome = campoEditarNome.value.trim().replace(/\s+/g, " ");
          const categoria = campoEditarCategoria.value;
          const quantidadeTexto = campoEditarQuantidade.value.trim();
          const quantidade =
            quantidadeTexto === "" ? null : Number(quantidadeTexto);
          const unidadeTexto = campoEditarUnidade.value.trim();
          const unidade =
            quantidade === null ? null : unidadeTexto || UNIDADE_PADRAO;
          const precoDigitado = campoEditarPreco.value.trim();
          const precoAproximado = normalizarPreco(precoDigitado);
          const observacao = campoEditarObservacao.value.trim();
          if (!nome || !categorias.includes(categoria)) return;
          if (precoDigitado && precoAproximado === null) {
            definirStatus("Informe um preço válido maior ou igual a zero.");
            return;
          }
          if (
            quantidade !== null &&
            (!Number.isFinite(quantidade) || quantidade < 0)
          ) {
            definirStatus(
              "Informe uma quantidade válida maior ou igual a zero.",
            );
            return;
          }

          if (atual.tipo === "extra") {
            const duplicado = extras.some(
              (item) =>
                item.id !== atual.id &&
                item.categoria === categoria &&
                item.nome.toLowerCase() === nome.toLowerCase(),
            );
            if (duplicado) {
              definirStatus("Já existe um item com esse nome na categoria.");
              return;
            }
            extras = extras.map((item) =>
              item.id === atual.id
                ? {
                    ...item,
                    nome,
                    categoria,
                    quantidade,
                    unidade,
                    preco_aproximado: precoAproximado,
                    observacao,
                  }
                : item,
            );
            salvarExtras();
            montarExtras();
            const secao = secoes.find((item) => item.titulo === categoria);
            if (secao) secao.detalhes.open = true;
            atualizar();
            itemEmEdicao = null;
            dialogEditar.close();
            return;
          }

          definirStatus("Sincronizando…");
          const { data, error } = await supabaseClient.rpc(
            "atualizar_item_catalogo",
            {
              p_categoria_atual: atual.categoria,
              p_nome_atual: atual.nome,
              p_categoria_nova: categoria,
              p_nome_novo: nome,
              p_quantidade_nova: quantidade,
              p_unidade_nova: unidade,
              p_preco_novo: precoAproximado,
              p_observacao_nova: observacao || null,
            },
          );
          if (error || !data) {
            definirStatus(
              error
                ? "Falha ao editar o item compartilhado."
                : "O item não foi alterado. Verifique se o nome já existe.",
            );
            if (error) console.error("Falha ao editar item:", error);
            return;
          }

          const idNovo = idDoItem(categoria, nome);
          const estavaMarcado = marcados.delete(atual.id);
          if (estavaMarcado) marcados.add(idNovo);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);

          const { data: catalogo, error: erroCatalogo } = await supabaseClient
            .from("lista_compras_catalogo")
            .select("produtos")
            .eq("id", true)
            .single();
          itemEmEdicao = null;
          dialogEditar.close();
          if (erroCatalogo || !Array.isArray(catalogo?.produtos)) {
            definirStatus("Item salvo. Atualize a página para ver os dados.");
            return;
          }
          montar(catalogo.produtos);
          definirStatus("Sincronizado");
        });

        formNovo.addEventListener("submit", async (e) => {
          e.preventDefault();
          const botaoAdicionar = formNovo.querySelector(
            'button[type="submit"]',
          );
          botaoAdicionar.disabled = true;
          try {
            const adicionado = await adicionarProdutoCompartilhado(
              campoNovo.value,
              campoCategoriaNovo.value,
              campoQuantidadeNovo.value,
              campoUnidadeNovo.value,
            );
            if (!adicionado) return;
            campoNovo.value = "";
            campoQuantidadeNovo.value = "";
            campoUnidadeNovo.value = UNIDADE_PADRAO;
            campoNovo.focus();
          } catch (erro) {
            definirStatus(
              "Falha de conexão ao adicionar o produto compartilhado.",
            );
            console.error("Falha ao adicionar produto compartilhado:", erro);
          } finally {
            botaoAdicionar.disabled = false;
          }
        });

        // ---- botões ----
        btnOcultar.setAttribute("aria-pressed", String(ocultarPegos));
        btnOcultar.addEventListener("click", () => {
          ocultarPegos = !ocultarPegos;
          btnOcultar.setAttribute("aria-pressed", String(ocultarPegos));
          guardar.gravar(CHAVE_OCULTAR, ocultarPegos);
          atualizar();
        });

        btnLimpar.addEventListener("click", () => {
          if (!marcados.size) return;
          if (!confirm("Desmarcar todos os itens?")) return;
          marcados.clear();
          salvarMarcados();
          app
            .querySelectorAll("input[type=checkbox]")
            .forEach((cb) => (cb.checked = false));
          atualizar();
        });

        // ---- mensagens de erro ----
        function mostrarErro(msg) {
          app.replaceChildren(
            el(
              "div",
              { class: "aviso" },
              el("h2", { text: "Não foi possível carregar a lista" }),
              el("p", { text: msg }),
            ),
          );
        }
      })();
    </script>
  </body>
</html>
