<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Minha lista de compras</title>
    <meta name="theme-color" content="#1f6b4a" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛒</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f2f5f0;
        --surface: #ffffff;
        --ink: #1c2a22;
        --muted: #66756b;
        --line: #dde5dc;
        --accent: #1f6b4a;
        --accent-soft: #dcefe3;
        --done: #98a69c;
        --note: #8a5a00;
        --note-bg: #fbefd2;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #121a15;
          --surface: #1a251e;
          --ink: #e8efe9;
          --muted: #9aaba0;
          --line: #2a382f;
          --accent: #5fc58f;
          --accent-soft: #23372b;
          --done: #66756b;
          --note: #f0c77a;
          --note-bg: #3a2f17;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        scroll-padding-top: 130px;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Figtree",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 17px;
        line-height: 1.4;
        -webkit-text-size-adjust: 100%;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 12px;
        border-bottom: 1px solid var(--line);
      }
      .wrap {
        max-width: 640px;
        margin: 0 auto;
      }

      .topo {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .contagem {
        font-size: 0.95rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .contagem strong {
        color: var(--ink);
        font-size: 1.15rem;
      }

      .barra {
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        margin: 10px 0 12px;
        overflow: hidden;
      }
      .barra > span {
        display: block;
        height: 100%;
        width: 0;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.25s ease;
      }

      .acoes {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status-sync {
        align-self: center;
        margin: 0 0 0 auto;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .acoes button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 99px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
      }
      .acoes button[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .acoes button[aria-pressed="true"] {
          color: #0e1a13;
        }
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 16px calc(40px + env(safe-area-inset-bottom, 0px));
      }

      section {
        margin-bottom: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      section.completa {
        border-color: var(--accent);
      }
      summary {
        list-style: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        font-weight: 700;
        font-size: 1.05rem;
        min-height: 52px;
      }
      summary::-webkit-details-marker {
        display: none;
      }
      summary .qtd {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      section.completa summary .qtd {
        color: var(--accent);
      }
      summary::after {
        content: "";
        width: 8px;
        height: 8px;
        flex: none;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 0.15s ease;
        margin-left: 4px;
      }
      details[open] > summary::after {
        transform: rotate(-135deg);
      }
      summary:focus-visible,
      .item:focus-within {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--line);
      }
      li {
        border-bottom: 1px solid var(--line);
      }
      li:last-child {
        border-bottom: 0;
      }
      li.oculto {
        display: none;
      }

      .item {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        padding: 13px 16px;
        cursor: pointer;
        min-height: 56px;
      }
      .item input {
        appearance: none;
        -webkit-appearance: none;
        flex: none;
        width: 28px;
        height: 28px;
        margin: 1px 0 0;
        border: 2px solid var(--muted);
        border-radius: 8px;
        background: transparent;
        display: grid;
        place-content: center;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .item input::after {
        content: "";
        width: 7px;
        height: 13px;
        margin-top: -2px;
        border-right: 3px solid #fff;
        border-bottom: 3px solid #fff;
        transform: rotate(45deg) scale(0);
        transition: transform 0.12s ease;
      }
      .item input:checked {
        background: var(--accent);
        border-color: var(--accent);
      }
      .item input:checked::after {
        transform: rotate(45deg) scale(1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .item input::after {
          border-color: #0e1a13;
        }
      }
      .item input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .texto {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
      }
      .nome {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .detalhe {
        font-size: 0.88rem;
        color: var(--muted);
      }
      .obs {
        display: inline-block;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--note);
        background: var(--note-bg);
        padding: 3px 9px;
        border-radius: 8px;
        align-self: flex-start;
      }

      .item:has(input:checked) .nome {
        text-decoration: line-through;
        color: var(--done);
        font-weight: 500;
      }
      .item:has(input:checked) .detalhe,
      .item:has(input:checked) .obs {
        opacity: 0.55;
      }

      .novo-wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 16px 0;
      }
      #form-novo {
        display: grid;
        grid-template-columns:
          minmax(0, 1.35fr) minmax(110px, 1fr) minmax(88px, 0.75fr)
          auto;
        gap: 8px;
        align-items: stretch;
      }
      #form-novo select {
        width: 100%;
        min-width: 0;
        font: inherit;
        padding: 12px 10px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-auth {
        display: grid;
        gap: 8px;
      }
      #form-auth label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      #form-auth input {
        min-width: 0;
        font: inherit;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-auth input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-auth .acoes {
        margin-top: 4px;
      }
      #form-novo input {
        min-width: 0;
        font: inherit;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #form-novo #novo-nome {
        grid-column: 1 / -1;
      }
      #form-novo #novo-quantidade {
        grid-column: 2;
      }
      #form-novo #novo-unidade {
        grid-column: 3;
      }
      #form-novo #novo-categoria {
        grid-column: 1;
      }
      #form-novo button {
        grid-column: 4;
      }
      #form-novo input::placeholder {
        color: var(--muted);
      }
      #form-novo input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-novo select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-novo button {
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
        border-radius: 12px;
        border: 0;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      #form-novo button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      @media (max-width: 480px) {
        #form-novo {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
        #form-novo #novo-nome {
          grid-column: 1 / -1;
        }
        #form-novo #novo-categoria {
          grid-column: 1;
        }
        #form-novo #novo-quantidade {
          grid-column: 2;
        }
        #form-novo #novo-unidade {
          grid-column: 1;
        }
        #form-novo button {
          grid-column: 2;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #form-novo button {
          color: #0e1a13;
        }
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      li.com-remover:not(.oculto) {
        display: flex;
        align-items: stretch;
      }
      li.com-remover .item {
        flex: 1;
        min-width: 0;
      }
      .remover {
        flex: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.6rem;
        line-height: 1;
        padding: 0 18px;
        cursor: pointer;
      }
      .remover:hover {
        color: var(--ink);
      }
      .remover:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: -3px;
      }

      .aviso {
        padding: 20px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      .aviso h2 {
        margin: 0 0 8px;
        font-size: 1.1rem;
      }
      .aviso p {
        margin: 6px 0;
        color: var(--muted);
      }
      .aviso code {
        background: var(--accent-soft);
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 0.9em;
      }

      #dialog-editar {
        width: min(440px, calc(100vw - 32px));
        max-width: 100%;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--surface);
        color: var(--ink);
      }
      #dialog-editar::backdrop {
        background: rgb(0 0 0 / 45%);
      }
      #form-editar {
        display: grid;
        gap: 8px;
        padding: 20px;
      }
      #form-editar h2 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      #form-editar label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      #form-editar input,
      #form-editar select {
        width: 100%;
        min-width: 0;
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
      }
      #form-editar input:focus-visible,
      #form-editar select:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 1px;
      }
      #form-editar .acoes {
        justify-content: flex-end;
        margin-top: 8px;
      }
      #form-editar button[type="submit"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .fim {
        text-align: center;
        padding: 18px;
        font-weight: 700;
        color: var(--accent);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="topo">
          <h1>Lista de compras</h1>
          <div class="contagem" id="contagem" aria-live="polite"></div>
        </div>
        <div
          class="barra"
          role="progressbar"
          aria-label="Itens pegos"
          aria-valuemin="0"
          aria-valuemax="100"
          id="barra"
        >
          <span id="barra-preench"></span>
        </div>
        <div class="acoes">
          <button type="button" id="btn-ocultar" aria-pressed="false">
            Ocultar pegos
          </button>
          <button type="button" id="btn-limpar">Desmarcar tudo</button>
          <p id="status-supabase" class="status-sync" role="status"></p>
          <button type="button" id="btn-sair" hidden>Sair</button>
        </div>
      </div>
    </header>

    <div class="novo-wrap">
      <div id="painel-conta" class="aviso" aria-live="polite">
        <form id="form-auth" autocomplete="on">
          <label for="auth-email">E-mail</label>
          <input id="auth-email" type="email" autocomplete="email" required />
          <label for="auth-senha">Senha</label>
          <input
            id="auth-senha"
            type="password"
            autocomplete="current-password"
            minlength="6"
            required
          />
          <div class="acoes">
            <button type="submit" id="btn-entrar">Entrar</button>
            <button type="button" id="btn-criar-conta">Criar conta</button>
          </div>
        </form>
      </div>
      <form id="form-novo" autocomplete="off">
        <label for="novo-nome" class="sr">Novo item</label>
        <input
          id="novo-nome"
          type="text"
          placeholder="Adicionar item à lista"
          maxlength="80"
          enterkeyhint="done"
        />
        <label for="novo-categoria" class="sr">Categoria do novo item</label>
        <select id="novo-categoria" required></select>
        <label for="novo-quantidade" class="sr">Quantidade</label>
        <input
          id="novo-quantidade"
          type="number"
          inputmode="decimal"
          min="0"
          step="any"
          placeholder="Qtd."
          enterkeyhint="done"
        />
        <label for="novo-unidade" class="sr">Unidade</label>
        <select id="novo-unidade">
          <option value="Un" selected>Un</option>
          <option value="kg">kg</option>
          <option value="g">g</option>
          <option value="mg">mg</option>
          <option value="L">L</option>
          <option value="mL">mL</option>
          <option value="pacote">pacote</option>
          <option value="caixa">caixa</option>
          <option value="bandeja">bandeja</option>
          <option value="frasco">frasco</option>
          <option value="lata">lata</option>
          <option value="pote">pote</option>
          <option value="sachê">sachê</option>
          <option value="rolo">rolo</option>
        </select>
        <button type="submit">Adicionar</button>
      </form>
    </div>

    <dialog id="dialog-editar" aria-labelledby="titulo-editar">
      <form id="form-editar" method="dialog">
        <h2 id="titulo-editar">Editar item</h2>
        <label for="editar-nome">Nome</label>
        <input id="editar-nome" type="text" maxlength="80" required />
        <label for="editar-categoria">Categoria</label>
        <select id="editar-categoria" required></select>
        <label for="editar-quantidade">Quantidade</label>
        <input id="editar-quantidade" type="text" maxlength="100" />
        <label for="editar-observacao">Observação</label>
        <input id="editar-observacao" type="text" maxlength="160" />
        <div class="acoes">
          <button type="button" id="cancelar-edicao">Cancelar</button>
          <button type="submit">Salvar</button>
        </div>
      </form>
    </dialog>

    <main id="app"><p class="detalhe">Carregando lista…</p></main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      (() => {
        const SUPABASE_URL = "https://gelnafoakvcimlvmpuqm.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY =
          "sb_publishable__iC2OHswRekbVQFKY7HCpQ_izodjTd_";
        const supabaseClient =
          window.supabase &&
          SUPABASE_URL.startsWith("https://") &&
          !SUPABASE_URL.includes("SEU-PROJETO") &&
          SUPABASE_PUBLISHABLE_KEY !== "SUA_CHAVE_PUBLICAVEL"
            ? window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
              )
            : null;
        const CHAVE_MARCADOS = "lista-compras:marcados";
        const CHAVE_OCULTAR = "lista-compras:ocultar-pegos";

        const app = document.getElementById("app");
        const contagem = document.getElementById("contagem");
        const barra = document.getElementById("barra");
        const barraPreench = document.getElementById("barra-preench");
        const btnOcultar = document.getElementById("btn-ocultar");
        const btnLimpar = document.getElementById("btn-limpar");
        const painelConta = document.getElementById("painel-conta");
        const formAuth = document.getElementById("form-auth");
        const campoEmail = document.getElementById("auth-email");
        const campoSenha = document.getElementById("auth-senha");
        const btnCriarConta = document.getElementById("btn-criar-conta");
        const btnSair = document.getElementById("btn-sair");
        const statusSupabase = document.getElementById("status-supabase");
        let usuario = null;
        let carregandoRemoto = false;
        let temporizadorSync = null;

        function definirStatus(mensagem) {
          statusSupabase.textContent = mensagem;
        }

        function agendarSincronizacao() {
          if (!supabaseClient || !usuario || carregandoRemoto) return;
          clearTimeout(temporizadorSync);
          temporizadorSync = setTimeout(async () => {
            definirStatus("Sincronizando…");
            const { error } = await supabaseClient
              .from("lista_compras_estado")
              .upsert(
                {
                  user_id: usuario.id,
                  marcados: [...marcados],
                  extras,
                  updated_at: new Date().toISOString(),
                },
                { onConflict: "user_id" },
              );
            if (error) {
              definirStatus("Falha ao sincronizar. Verifique a conexão.");
              console.error("Falha ao sincronizar a lista:", error);
            } else {
              definirStatus("Sincronizado");
            }
          }, 300);
        }

        function mostrarAreaAutenticada(autenticado) {
          app.hidden = Boolean(supabaseClient && !autenticado);
          painelConta.hidden = Boolean(supabaseClient && autenticado);
          document.getElementById("form-novo").hidden = Boolean(
            supabaseClient && !autenticado,
          );
          btnOcultar.disabled = Boolean(supabaseClient && !autenticado);
          btnLimpar.disabled = Boolean(supabaseClient && !autenticado);
          formAuth.hidden = Boolean(supabaseClient && autenticado);
          btnSair.hidden = !supabaseClient || !autenticado;
        }

        async function carregarEstadoRemoto(sessao) {
          usuario = sessao?.user ?? null;
          mostrarAreaAutenticada(Boolean(usuario));
          if (!usuario) {
            definirStatus(
              "Entre para sincronizar sua lista entre dispositivos.",
            );
            return;
          }

          carregandoRemoto = true;
          definirStatus("Carregando lista…");
          const { data: catalogo, error: erroCatalogo } = await supabaseClient
            .from("lista_compras_catalogo")
            .select("produtos")
            .eq("id", true)
            .single();

          if (erroCatalogo || !Array.isArray(catalogo?.produtos)) {
            carregandoRemoto = false;
            mostrarErro(
              erroCatalogo
                ? `Falha ao carregar o catálogo do Supabase: ${erroCatalogo.message}`
                : "O catálogo do Supabase está vazio ou em formato inválido.",
            );
            return;
          }

          montar(catalogo.produtos);

          const { data, error } = await supabaseClient
            .from("lista_compras_estado")
            .select("marcados, extras")
            .eq("user_id", usuario.id)
            .maybeSingle();

          if (error) {
            carregandoRemoto = false;
            console.error("Falha ao carregar estado da lista:", error);
            return;
          }

          if (data) {
            marcados.clear();
            (Array.isArray(data.marcados) ? data.marcados : []).forEach((id) =>
              marcados.add(id),
            );
            extras = Array.isArray(data.extras)
              ? data.extras
                  .filter(
                    (item) =>
                      item &&
                      typeof item.id === "string" &&
                      typeof item.nome === "string",
                  )
                  .map((item) => ({
                    ...item,
                    categoria: categorias.includes(item.categoria)
                      ? item.categoria
                      : categoriaPadrao(),
                    quantidade:
                      typeof item.quantidade === "string"
                        ? item.quantidade
                        : "",
                  }))
              : [];
          }
          montar(catalogo.produtos);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          guardar.gravar(CHAVE_EXTRAS, extras);
          carregandoRemoto = false;
          if (data) {
            definirStatus("Sincronizado");
          } else {
            definirStatus("Sincronizando…");
            agendarSincronizacao();
          }
        }

        if (supabaseClient) {
          mostrarAreaAutenticada(false);
          supabaseClient.auth.onAuthStateChange((_evento, sessao) => {
            setTimeout(() => carregarEstadoRemoto(sessao), 0);
          });
        } else {
          formAuth.hidden = true;
          btnSair.hidden = true;
          definirStatus(
            "Configure a URL e a chave publicável do Supabase para carregar a lista.",
          );
          mostrarErro(
            "A lista agora é carregada do Supabase. Configure a conexão para continuar.",
          );
        }

        formAuth.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!supabaseClient) return;
          definirStatus("Entrando…");
          const { error } = await supabaseClient.auth.signInWithPassword({
            email: campoEmail.value.trim(),
            password: campoSenha.value,
          });
          definirStatus(
            error
              ? `Não foi possível entrar: ${error.message}`
              : "Login realizado.",
          );
        });

        btnCriarConta.addEventListener("click", async () => {
          if (!supabaseClient) return;
          definirStatus("Criando conta…");
          const { data, error } = await supabaseClient.auth.signUp({
            email: campoEmail.value.trim(),
            password: campoSenha.value,
          });
          definirStatus(
            error
              ? `Não foi possível criar a conta: ${error.message}`
              : data.session
                ? "Conta criada."
                : "Conta criada. Confira seu e-mail para confirmar o cadastro.",
          );
        });

        btnSair.addEventListener("click", async () => {
          const { error } = await supabaseClient.auth.signOut();
          if (error) definirStatus(`Não foi possível sair: ${error.message}`);
        });

        // ---- localStorage (com proteção para navegadores que bloqueiam) ----
        const guardar = {
          ler(chave, padrao) {
            try {
              const v = localStorage.getItem(chave);
              return v === null ? padrao : JSON.parse(v);
            } catch (e) {
              return padrao;
            }
          },
          gravar(chave, valor) {
            try {
              localStorage.setItem(chave, JSON.stringify(valor));
            } catch (e) {
              /* sem armazenamento */
            }
          },
        };

        const marcados = new Set(guardar.ler(CHAVE_MARCADOS, []));
        let ocultarPegos = guardar.ler(CHAVE_OCULTAR, false) === true;

        const salvarMarcados = () => {
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          agendarSincronizacao();
        };

        // ---- utilidades ----
        const idDoItem = (categoria, nome) => `${categoria}|${nome}`;
        const el = (tag, attrs = {}, ...filhos) => {
          const n = document.createElement(tag);
          for (const [k, v] of Object.entries(attrs)) {
            if (k === "class") n.className = v;
            else if (k === "text") n.textContent = v;
            else n.setAttribute(k, v);
          }
          filhos.forEach((f) => n.append(f));
          return n;
        };
        const quantidadeUtil = (q) => q && !/^n[aã]o informad/i.test(q.trim());

        // ---- renderização ----
        const CHAVE_EXTRAS = "lista-compras:extras";
        const CATEGORIA_PADRAO = "Outros";
        const UNIDADE_PADRAO = "Un";
        const UNIDADES = new Set([
          UNIDADE_PADRAO,
          "kg",
          "g",
          "mg",
          "L",
          "mL",
          "pacote",
          "caixa",
          "bandeja",
          "frasco",
          "lata",
          "pote",
          "sachê",
          "rolo",
        ]);
        const UNIDADES_PLURAIS = {
          pacote: "pacotes",
          caixa: "caixas",
          bandeja: "bandejas",
          frasco: "frascos",
          lata: "latas",
          pote: "potes",
          sachê: "sachês",
          rolo: "rolos",
        };
        let categorias = [];

        const categoriaPadrao = () =>
          categorias.includes(CATEGORIA_PADRAO)
            ? CATEGORIA_PADRAO
            : categorias.includes("Outros alimentos")
              ? "Outros alimentos"
              : categorias[0] || CATEGORIA_PADRAO;

        const lerExtras = () => {
          const v = guardar.ler(CHAVE_EXTRAS, []);
          return Array.isArray(v)
            ? v.filter(
                (x) =>
                  x && typeof x.id === "string" && typeof x.nome === "string",
              )
            : [];
        };
        let extras = lerExtras();
        const salvarExtras = () => {
          guardar.gravar(CHAVE_EXTRAS, extras);
          agendarSincronizacao();
        };

        let secoes = []; // { elemento, ids, qtd, lista }
        let total = 0;

        function criarItem(
          id,
          nome,
          quantidade,
          observacao,
          aoEditar,
          aoRemover,
          extra = false,
        ) {
          const cb = el("input", { type: "checkbox" });
          cb.checked = marcados.has(id);
          cb.addEventListener("change", () => {
            if (cb.checked) marcados.add(id);
            else marcados.delete(id);
            salvarMarcados();
            atualizar();
          });

          const texto = el(
            "span",
            { class: "texto" },
            el("span", { class: "nome", text: nome }),
          );
          if (quantidade)
            texto.append(el("span", { class: "detalhe", text: quantidade }));
          if (observacao)
            texto.append(el("span", { class: "obs", text: observacao }));

          const li = el(
            "li",
            { "data-id": id },
            el("label", { class: "item" }, cb, texto),
          );
          if (extra) li.dataset.extra = "true";
          if (aoEditar) {
            const btn = el("button", {
              type: "button",
              class: "remover editar",
              "aria-label": `Editar ${nome}`,
              title: `Editar ${nome}`,
              text: "✎",
            });
            btn.addEventListener("click", aoEditar);
            li.classList.add("com-remover");
            li.append(btn);
          }
          if (aoRemover) {
            const btn = el("button", {
              type: "button",
              class: "remover",
              "aria-label": `Remover ${nome}`,
              text: "×",
            });
            btn.addEventListener("click", aoRemover);
            li.classList.add("com-remover");
            li.append(btn);
          }
          return li;
        }

        function criarSecao(titulo, ids, lista) {
          const qtd = el("span", { class: "qtd" });
          const detalhes = el(
            "details",
            { open: "" },
            el("summary", {}, el("span", { text: titulo }), qtd),
            lista,
          );
          return {
            elemento: el("section", {}, detalhes),
            titulo,
            detalhes,
            ids,
            idsBase: [...ids],
            qtd,
            lista,
          };
        }

        function montar(dados) {
          app.replaceChildren();
          secoes = [];
          categorias = dados
            .map((cat) => cat.categoria)
            .filter(
              (categoria, indice, lista) =>
                typeof categoria === "string" &&
                lista.indexOf(categoria) === indice,
            );
          campoCategoriaNovo.replaceChildren(
            ...categorias.map((categoria) =>
              el("option", {
                value: categoria,
                text: categoria === "Outros alimentos" ? "Outros" : categoria,
              }),
            ),
          );
          campoCategoriaNovo.value = categoriaPadrao();
          extras = extras.map((item) => ({
            ...item,
            categoria: categorias.includes(item.categoria)
              ? item.categoria
              : categoriaPadrao(),
            quantidade:
              typeof item.quantidade === "string" ? item.quantidade : "",
          }));

          dados.forEach((cat) => {
            const ids = [];
            const lista = el("ul");
            (cat.itens || []).forEach((item) => {
              const obj = typeof item === "string" ? { nome: item } : item;
              if (!obj || !obj.nome) return;
              const id = idDoItem(cat.categoria, obj.nome);
              ids.push(id);
              lista.append(
                criarItem(
                  id,
                  obj.nome,
                  quantidadeUtil(obj.quantidade) ? obj.quantidade : "",
                  obj.observacao || "",
                  () =>
                    abrirEditor({
                      tipo: "catalogo",
                      id,
                      categoria: cat.categoria,
                      nome: obj.nome,
                      quantidade: obj.quantidade || "",
                      observacao: obj.observacao || "",
                    }),
                  () => removerItemCatalogo(cat.categoria, obj.nome, id),
                ),
              );
            });
            const sec = criarSecao(cat.categoria, ids, lista);
            secoes.push(sec);
            app.append(sec.elemento);
          });

          app.append(
            el("p", {
              class: "fim",
              id: "fim",
              hidden: "",
              text: "Compras concluídas! 🎉",
            }),
          );
          montarExtras();
          atualizar();
        }

        function montarExtras() {
          secoes.forEach((secao) => {
            secao.lista
              .querySelectorAll('li[data-extra="true"]')
              .forEach((item) => item.remove());
            secao.ids = [...secao.idsBase];

            extras
              .filter((item) => item.categoria === secao.titulo)
              .forEach((item) => {
                secao.ids.push(item.id);
                secao.lista.append(
                  criarItem(
                    item.id,
                    item.nome,
                    quantidadeUtil(item.quantidade) ? item.quantidade : "",
                    item.observacao || "",
                    () =>
                      abrirEditor({
                        tipo: "extra",
                        id: item.id,
                        categoria: item.categoria,
                        nome: item.nome,
                        quantidade: item.quantidade || "",
                        observacao: item.observacao || "",
                      }),
                    () => removerExtra(item.id),
                    true,
                  ),
                );
              });
          });
        }

        function adicionarExtra(nome, categoria, quantidade, unidade) {
          const limpo = nome.trim().replace(/\s+/g, " ");
          if (!limpo) return;
          const quantidadeNumerica = quantidade.trim();
          const numero = Number(quantidadeNumerica);
          const unidadeEscolhida = UNIDADES.has(unidade)
            ? unidade
            : UNIDADE_PADRAO;
          const unidadeFinal =
            numero === 1
              ? unidadeEscolhida
              : UNIDADES_PLURAIS[unidadeEscolhida] || unidadeEscolhida;
          const quantidadeLimpa = quantidadeNumerica
            ? `${new Intl.NumberFormat("pt-BR", {
                maximumFractionDigits: 6,
              }).format(numero)} ${unidadeFinal}`
            : "";
          const categoriaEscolhida = categorias.includes(categoria)
            ? categoria
            : categoriaPadrao();
          const repetido = extras.some(
            (x) =>
              x.categoria === categoriaEscolhida &&
              x.nome.toLowerCase() === limpo.toLowerCase(),
          );
          if (!repetido) {
            const id =
              "extra|" +
              Date.now().toString(36) +
              Math.random().toString(36).slice(2, 6);
            extras.push({
              id,
              nome: limpo,
              categoria: categoriaEscolhida,
              quantidade: quantidadeLimpa,
            });
            salvarExtras();
            montarExtras();
            secoes.find(
              (secao) => secao.titulo === categoriaEscolhida,
            ).detalhes.open = true;
            atualizar();
          }
        }

        function removerExtra(id) {
          const extra = extras.find((item) => item.id === id);
          if (!extra || !confirm(`Excluir "${extra.nome}" da sua lista?`)) {
            return;
          }
          extras = extras.filter((x) => x.id !== id);
          marcados.delete(id);
          salvarExtras();
          salvarMarcados();
          montarExtras();
          atualizar();
        }

        async function removerItemCatalogo(categoria, nome, id) {
          if (
            !confirm(
              `Excluir "${nome}" do catálogo compartilhado para todos os usuários?`,
            )
          ) {
            return;
          }

          definirStatus("Sincronizando…");
          const { data, error } = await supabaseClient.rpc(
            "remover_item_catalogo",
            { p_categoria: categoria, p_nome: nome },
          );

          if (error || !data) {
            definirStatus(
              error
                ? "Falha ao excluir o item compartilhado."
                : "O item já não está no catálogo. Atualize a página.",
            );
            if (error) console.error("Falha ao excluir item:", error);
            return;
          }

          marcados.delete(id);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);
          const secao = secoes.find((item) => item.ids.includes(id));
          if (secao) {
            secao.ids = secao.ids.filter((itemId) => itemId !== id);
            secao.idsBase = secao.idsBase.filter((itemId) => itemId !== id);
            const linha = [...secao.lista.querySelectorAll("li[data-id]")].find(
              (item) => item.dataset.id === id,
            );
            if (linha) linha.remove();
            atualizar();
          }
          definirStatus("Sincronizado");
        }

        function atualizar() {
          let pegos = 0;
          total = secoes.reduce((n, s) => n + s.ids.length, 0);
          secoes.forEach((s) => {
            const feitos = s.ids.filter((id) => marcados.has(id)).length;
            pegos += feitos;
            s.qtd.textContent = `${feitos}/${s.ids.length}`;
            s.elemento.classList.toggle(
              "completa",
              s.ids.length > 0 && feitos === s.ids.length,
            );
            s.lista.querySelectorAll("li").forEach((li) => {
              li.classList.toggle(
                "oculto",
                ocultarPegos && marcados.has(li.dataset.id),
              );
            });
            s.elemento.hidden =
              ocultarPegos && feitos === s.ids.length && s.ids.length > 0;
          });

          const pct = total ? Math.round((pegos / total) * 100) : 0;
          contagem.innerHTML = `<strong>${pegos}</strong> de ${total} pegos`;
          barraPreench.style.width = pct + "%";
          barra.setAttribute("aria-valuenow", pct);
          const fim = document.getElementById("fim");
          if (fim) fim.hidden = !(total > 0 && pegos === total);
        }

        // ---- formulário de novo item ----
        const formNovo = document.getElementById("form-novo");
        const campoNovo = document.getElementById("novo-nome");
        const campoQuantidadeNovo = document.getElementById("novo-quantidade");
        const campoCategoriaNovo = document.getElementById("novo-categoria");
        const campoUnidadeNovo = document.getElementById("novo-unidade");
        const dialogEditar = document.getElementById("dialog-editar");
        const formEditar = document.getElementById("form-editar");
        const campoEditarNome = document.getElementById("editar-nome");
        const campoEditarCategoria =
          document.getElementById("editar-categoria");
        const campoEditarQuantidade =
          document.getElementById("editar-quantidade");
        const campoEditarObservacao =
          document.getElementById("editar-observacao");
        let itemEmEdicao = null;

        function abrirEditor(item) {
          itemEmEdicao = item;
          campoEditarCategoria.replaceChildren(
            ...categorias.map((categoria) =>
              el("option", {
                value: categoria,
                text: categoria === "Outros alimentos" ? "Outros" : categoria,
              }),
            ),
          );
          campoEditarNome.value = item.nome;
          campoEditarCategoria.value = item.categoria;
          campoEditarQuantidade.value = item.quantidade;
          campoEditarObservacao.value = item.observacao;
          dialogEditar.showModal();
          campoEditarNome.focus();
        }

        document
          .getElementById("cancelar-edicao")
          .addEventListener("click", () => dialogEditar.close());

        formEditar.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!itemEmEdicao) return;

          const atual = itemEmEdicao;
          const nome = campoEditarNome.value.trim().replace(/\s+/g, " ");
          const categoria = campoEditarCategoria.value;
          const quantidade = campoEditarQuantidade.value.trim();
          const observacao = campoEditarObservacao.value.trim();
          if (!nome || !categorias.includes(categoria)) return;

          if (atual.tipo === "extra") {
            const duplicado = extras.some(
              (item) =>
                item.id !== atual.id &&
                item.categoria === categoria &&
                item.nome.toLowerCase() === nome.toLowerCase(),
            );
            if (duplicado) {
              definirStatus("Já existe um item com esse nome na categoria.");
              return;
            }
            extras = extras.map((item) =>
              item.id === atual.id
                ? { ...item, nome, categoria, quantidade, observacao }
                : item,
            );
            salvarExtras();
            montarExtras();
            const secao = secoes.find((item) => item.titulo === categoria);
            if (secao) secao.detalhes.open = true;
            atualizar();
            itemEmEdicao = null;
            dialogEditar.close();
            return;
          }

          definirStatus("Sincronizando…");
          const { data, error } = await supabaseClient.rpc(
            "atualizar_item_catalogo",
            {
              p_categoria_atual: atual.categoria,
              p_nome_atual: atual.nome,
              p_categoria_nova: categoria,
              p_nome_novo: nome,
              p_quantidade_nova: quantidade || null,
              p_observacao_nova: observacao || null,
            },
          );
          if (error || !data) {
            definirStatus(
              error
                ? "Falha ao editar o item compartilhado."
                : "O item não foi alterado. Verifique se o nome já existe.",
            );
            if (error) console.error("Falha ao editar item:", error);
            return;
          }

          const idNovo = idDoItem(categoria, nome);
          const estavaMarcado = marcados.delete(atual.id);
          if (estavaMarcado) marcados.add(idNovo);
          guardar.gravar(CHAVE_MARCADOS, [...marcados]);

          const { data: catalogo, error: erroCatalogo } = await supabaseClient
            .from("lista_compras_catalogo")
            .select("produtos")
            .eq("id", true)
            .single();
          itemEmEdicao = null;
          dialogEditar.close();
          if (erroCatalogo || !Array.isArray(catalogo?.produtos)) {
            definirStatus("Item salvo. Atualize a página para ver os dados.");
            return;
          }
          montar(catalogo.produtos);
          definirStatus("Sincronizado");
        });

        formNovo.addEventListener("submit", (e) => {
          e.preventDefault();
          adicionarExtra(
            campoNovo.value,
            campoCategoriaNovo.value,
            campoQuantidadeNovo.value,
            campoUnidadeNovo.value,
          );
          campoNovo.value = "";
          campoQuantidadeNovo.value = "";
          campoUnidadeNovo.value = UNIDADE_PADRAO;
          campoNovo.focus();
        });

        // ---- botões ----
        btnOcultar.setAttribute("aria-pressed", String(ocultarPegos));
        btnOcultar.addEventListener("click", () => {
          ocultarPegos = !ocultarPegos;
          btnOcultar.setAttribute("aria-pressed", String(ocultarPegos));
          guardar.gravar(CHAVE_OCULTAR, ocultarPegos);
          atualizar();
        });

        btnLimpar.addEventListener("click", () => {
          if (!marcados.size) return;
          if (!confirm("Desmarcar todos os itens?")) return;
          marcados.clear();
          salvarMarcados();
          app
            .querySelectorAll("input[type=checkbox]")
            .forEach((cb) => (cb.checked = false));
          atualizar();
        });

        // ---- mensagens de erro ----
        function mostrarErro(msg) {
          app.replaceChildren(
            el(
              "div",
              { class: "aviso" },
              el("h2", { text: "Não foi possível carregar a lista" }),
              el("p", { text: msg }),
            ),
          );
        }
      })();
    </script>
  </body>
</html>
